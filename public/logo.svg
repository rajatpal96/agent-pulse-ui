<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1c140f" />
      <stop offset="100%" stopColor="#0c0805" />
    </linearGradient>
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#d97706" stopOpacity="0.2" />
    </linearGradient>
    <linearGradient id="logoAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>
    <linearGradient id="logoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Brand Mark Container -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="52" fill="url(#logoBgGrad)" />
    <rect width="200" height="200" rx="52" stroke="url(#logoBorderGrad)" stroke-width="6" />

    <circle cx="100" cy="100" r="60" fill="#f59e0b" fill-opacity="0.15" />

    <!-- Wave 1 (Amber) -->
    <path
      d="M55 100 C 55 65, 90 55, 115 80 L 140 105 C 165 125, 150 155, 120 150 C 90 145, 75 110, 105 90"
      stroke="url(#logoAmberGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#logoGlow)"
    />

    <!-- Wave 2 (Emerald) -->
    <path
      d="M145 100 C 145 135, 110 145, 85 120 L 60 95 C 35 75, 50 45, 80 50 C 110 55, 125 90, 95 110"
      stroke="url(#logoEmeraldGrad)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.9"
    />

    <!-- Nodes -->
    <circle cx="65" cy="90" r="8" fill="#fbbf24" filter="url(#logoGlow)" />
    <circle cx="135" cy="110" r="8" fill="#34d399" filter="url(#logoGlow)" />
    <circle cx="100" cy="100" r="11" fill="#ffffff" filter="url(#logoGlow)" />
  </g>

  <!-- Typography -->
  <text x="250" y="125" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="-2">
    Token<tspan fill="url(#textGrad)">Trail</tspan>
  </text>
  <text x="254" y="172" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="22" fill="#d97706" letter-spacing="4">
    AI FLEET OBSERVABILITY
  </text>
</svg>
