<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1c140f" />
      <stop offset="50%" stopColor="#140e0a" />
      <stop offset="100%" stopColor="#0a0705" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#d97706" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#b45309" stopOpacity="0.1" />
    </linearGradient>
    <linearGradient id="trailGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>
    <linearGradient id="trailGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hex-Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="128" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)" />

  <!-- Infinity / Telemetry Ribbon Wave 1 (Amber) -->
  <path
    d="M136 256 C 136 170, 220 140, 280 200 L 350 260 C 410 310, 380 380, 300 370 C 230 360, 190 280, 260 230"
    stroke="url(#trailGrad1)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Intersecting Ribbon Wave 2 (Emerald / Mint) -->
  <path
    d="M376 256 C 376 342, 292 372, 232 312 L 162 252 C 102 202, 132 132, 212 142 C 282 152, 322 232, 252 282"
    stroke="url(#trailGrad2)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />

  <!-- Active Telemetry Nodes -->
  <circle cx="156" cy="226" r="22" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="356" cy="286" r="22" fill="#34d399" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)" />
</svg>
